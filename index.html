<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系网 - 记忆你的人生</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 注册/登录页面 -->
    <div id="auth-page" class="page">
        <div class="auth-container">
            <div class="logo">🔗 关系网</div>
            <h1>欢迎来到关系网</h1>
            <p class="subtitle">记录人生记忆，连接人际关系</p>

            <div class="auth-form">
                <div class="input-group">
                    <span class="input-icon">📱</span>
                    <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
                </div>

                <div class="input-group-inline">
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="text" id="code" placeholder="请输入验证码" maxlength="6">
                    </div>
                    <button type="button" id="send-code-btn" class="code-btn">获取验证码</button>
                </div>

                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" placeholder="请输入您的姓名">
                </div>

                <button type="button" id="login-btn" class="primary-btn">开始记录</button>
            </div>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page hidden">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <button class="icon-btn">≡</button>
                <span class="logo-text">关系网</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="view-toggle">🔄</button>
                <button class="btn" id="add-category-btn">⊕ 添加分类</button>
                <div class="user-avatar" id="user-avatar">👤</div>
            </div>
        </header>

        <!-- 垂直时间线视图 -->
        <div id="vertical-timeline" class="timeline-view vertical">
            <div class="timeline-container" id="vertical-timeline-content">
                <!-- 时间线内容将由JS动态生成 -->
            </div>
            <button class="fab-btn" id="add-memory-fab">+</button>
        </div>

        <!-- 水平时间线视图 -->
        <div id="horizontal-timeline" class="timeline-view horizontal hidden">
            <div class="horizontal-stages" id="horizontal-stages-content">
                <!-- 水平时间线内容将由JS动态生成 -->
            </div>
            <div class="horizontal-memories" id="horizontal-memories-content">
                <!-- 选中阶段的记忆 -->
            </div>
        </div>
    </div>

    <!-- 创建分类弹窗 -->
    <div id="category-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建记忆分类</h3>
                <button class="close-btn" data-close="category-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="preset-templates">
                    <p class="section-label">选择预置模板</p>
                    <div class="template-grid" id="preset-templates">
                        <button class="template-btn" data-template="出生">出生</button>
                        <button class="template-btn" data-template="幼儿园">幼儿园</button>
                        <button class="template-btn" data-template="小学">小学</button>
                        <button class="template-btn" data-template="中学">中学</button>
                        <button class="template-btn" data-template="高中">高中</button>
                        <button class="template-btn" data-template="大学">大学</button>
                        <button class="template-btn" data-template="硕士">硕士</button>
                        <button class="template-btn" data-template="工作">工作</button>
                        <button class="template-btn" data-template="退休">退休</button>
                    </div>
                </div>
                <div class="custom-input">
                    <p class="section-label">或 自定义创建</p>
                    <div class="input-group">
                        <label>分类名称</label>
                        <input type="text" id="category-name" placeholder="例如：北京大学">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>开始时间</label>
                            <input type="number" id="start-year" placeholder="年" min="1900" max="2100">
                            <input type="number" id="start-month" placeholder="月" min="1" max="12">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>结束时间</label>
                            <input type="number" id="end-year" placeholder="年" min="1900" max="2100">
                            <input type="number" id="end-month" placeholder="月" min="1" max="12">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>地点</label>
                        <input type="text" id="category-location" placeholder="例如：北京">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" data-close="category-modal">取消</button>
                <button class="btn primary" id="save-category-btn">创建</button>
            </div>
        </div>
    </div>

    <!-- 添加记忆弹窗 -->
    <div id="memory-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加记忆</h3>
                <button class="close-btn" data-close="memory-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>所属分类</label>
                    <select id="memory-category-select">
                        <option value="">请选择分类</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>记忆标题</label>
                    <input type="text" id="memory-title" placeholder="例如：六一儿童节表演">
                </div>
                <div class="input-group">
                    <label>记忆描述</label>
                    <textarea id="memory-description" rows="4" placeholder="描述发生了什么..."></textarea>
                </div>
                <div class="input-group">
                    <label>发生时间</label>
                    <div class="date-input-row">
                        <input type="number" id="memory-year" placeholder="年" min="1900" max="2100">
                        <input type="number" id="memory-month" placeholder="月" min="1" max="12">
                        <input type="number" id="memory-day" placeholder="日" min="1" max="31">
                        <label class="checkbox-label">
                            <input type="checkbox" id="time-unknown">
                            <span>时间不详</span>
                        </label>
                    </div>
                </div>
                <div class="input-group">
                    <label>关联人物</label>
                    <div class="people-tags" id="linked-people">
                        <!-- 已关联的人物标签 -->
                    </div>
                    <div class="add-person-row">
                        <input type="text" id="new-person-name" placeholder="输入姓名">
                        <select id="new-person-relation">
                            <option value="家人">家人</option>
                            <option value="同学">同学</option>
                            <option value="老师">老师</option>
                            <option value="生意伙伴">生意伙伴</option>
                            <option value="邻居">邻居</option>
                            <option value="朋友">朋友</option>
                        </select>
                        <button type="button" class="btn small" id="add-person-btn">添加</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" data-close="memory-modal">取消</button>
                <button class="btn primary" id="save-memory-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- 人物详情弹窗 -->
    <div id="person-detail-modal" class="modal hidden">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="person-detail-name">人物详情</h3>
                <button class="close-btn" data-close="person-detail-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="person-info">
                    <div class="person-avatar-large">👤</div>
                    <div class="person-meta">
                        <h2 id="detail-person-name">张三</h2>
                        <p id="detail-person-relation">同学</p>
                    </div>
                </div>
                <div class="relationship-strength">
                    <h4>关系强度</h4>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill" style="width: 85%"></div>
                    </div>
                    <p class="strength-text">
                        <span id="strength-count">12</span> 条共同记忆
                        <span class="strength-percent" id="strength-percent">85%</span>
                    </p>
                </div>
                <div class="related-memories">
                    <h4>相关记忆</h4>
                    <div id="related-memories-list">
                        <!-- 记忆列表 -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" id="delete-person-btn">删除人物</button>
                <button class="btn primary" data-close="person-detail-modal">关闭</button>
            </div>
        </div>
    </div>

    <!-- 记忆图谱视图 -->
    <div id="graph-page" class="page hidden">
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" id="back-to-timeline">← 返回</button>
                <span class="logo-text">记忆图谱</span>
            </div>
            <div class="header-right">
                <button class="btn" id="graph-filter-btn">筛选</button>
            </div>
        </header>
        <div class="graph-container">
            <canvas id="graph-canvas"></canvas>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app-api.js"></script>
</body>
</html>
